# Pull-request triage (issue #127).
#
# Runs `actions/labeler@v5` with the configuration in
# `.github/labeler.yml`. Each PR gets `api`, `cli`, `frontend`, `ci`,
# `documentation`, `storage`, `testing`, or `security` applied based on
# which file globs the PR touches.
#
# NOTE: temporarily using `pull_request` (instead of `pull_request_target`)
# so that CI reads the labeler config from this branch during the initial
# v5 migration. Once this PR is merged, revert to `pull_request_target`
# (which is the correct event for production — it has `pull-requests: write`
# in the base-branch context and the action itself is read-only against code).
# See: https://github.com/actions/labeler#updating-major-version-of-the-labeler

name: Pull Request Labeler

permissions:
  contents: read
  pull-requests: write

on:
  - pull_request

jobs:
  labeler:
    name: Apply file-glob → label mapping
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Apply labels
        uses: actions/labeler@v5
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"
          configuration-path: .github/labeler.yml
